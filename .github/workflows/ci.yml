name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # Pinned: newer SwiftLint releases add rules. Keep it the same as on the developers' Macs.
      SWIFTLINT_VERSION: 0.65.1
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Lint
        run: swiftlint lint --strict

      - name: Pick simulator
        run: |
          id=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | test("iOS-27-2")) | .value[]
              | select(.name | startswith("iPhone")) | .udid' | head -1)
          test -n "$id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      # Warnings are errors through the project and package settings: passed here they would reach TCA too.
      - name: Build and test
        run: |
          xcodebuild test \
            -workspace TheMilkyWay.xcworkspace \
            -scheme TheMilkyWayDebug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
